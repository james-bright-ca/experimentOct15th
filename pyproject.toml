[project]
name = "twinfm"
dynamic = ["version"]
description = "Two-panel file manager for local files and a btty (Beacon IDE) workspace"
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
twinfm = "twinfm.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/twinfm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/twinfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
